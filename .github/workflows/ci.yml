name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install '.[dev]'

      - name: Test
        # No database and no network: the suite runs against a fixture taxonomy.
        run: pytest -q

  integration:
    name: Integration (real PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: digest_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DIGEST_DB_HOST: localhost
      DIGEST_DB_PORT: '5432'
      DIGEST_DB_NAME: digest_test
      DIGEST_DB_USER: test
      DIGEST_DB_PASSWORD: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: pip install '.[dev]'

      # The unit suite mocks the cursor, so a column the schema never declares
      # looks identical to one it does. This job executes the shipped SQL and
      # the storage layer against a real database, which is the only way that
      # class of bug surfaces before a user hits it.
      - name: Migrate and run integration tests
        run: pytest tests/test_integration_db.py -v

      - name: Assert migrate is idempotent from a clean database
        run: |
          python -c "
          from digest.migrate import run_migrations, available_migrations
          assert run_migrations() == [], 'second migrate re-applied a migration'
          print('idempotent across', len(available_migrations()), 'migration(s)')
          "

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Ruff
        run: ruff check .

  package:
    name: Build + import check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Build wheel and sdist
        run: |
          pip install build
          python -m build

      - name: Install the wheel and check the entrypoints
        # Installs from the built wheel, not the source tree, so a missing
        # package-data entry (the schema SQL) fails here rather than in someone
        # else's deployment.
        run: |
          pip install dist/*.whl
          cd /tmp
          research-digest --help
          python -c "
          from digest.migrate import available_migrations
          assert available_migrations() == ['001_initial.sql'], available_migrations()
          print('schema SQL ships in the wheel')
          "
