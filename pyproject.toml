[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-digest"
version = "0.1.1"
description = "Crawl, classify and summarise research sources into topic-filtered digests"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Coefficient Giving" }]
keywords = ["digest", "rss", "crawler", "classification", "llm", "research"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Indexing",
]
license = "MIT"
license-files = ["LICENSE"]

# Pinned, not floating. These were `>=` ranges for the pipeline's first two
# years and broke repeatedly on transitive updates (notably anthropic and
# curl_cffi). Bump them deliberately.
dependencies = [
    "requests==2.32.4",
    "beautifulsoup4==4.14.3",
    "defusedxml==0.7.1",
    "anthropic==0.75.0",
    "psycopg2-binary==2.9.11",
    "curl_cffi==0.14.0",
]

[project.optional-dependencies]
# Fallback summariser for abstracts Claude declines to summarise.
gemini = ["google-genai>=1.0.0"]
# Reading DB credentials from AWS Secrets Manager instead of env vars.
aws = ["boto3>=1.34.0"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/dmoskov/research-digest"
Issues = "https://github.com/dmoskov/research-digest/issues"

[project.scripts]
research-digest = "digest.cli:main"

[tool.setuptools.packages.find]
include = ["digest*"]

[tool.setuptools.package-data]
digest = ["schema/*.sql"]
